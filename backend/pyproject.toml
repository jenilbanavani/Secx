[project]
name = "decisio-backend"
version = "0.1.0"
description = "Engineering Decision Capture & Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",         # async SQLite driver for local dev

    # Validation & settings
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0",

    # GitHub integration
    "httpx>=0.27.0",              # async HTTP client for GitHub API

    # LLM & embeddings (Phase 1)
    "openai>=1.30.0",

    # Security
    "python-jose[cryptography]>=3.3.0",   # JWT tokens
    "cryptography>=42.0.0",               # token encryption
    "passlib>=1.7.4",

    # Utilities
    "python-multipart>=0.0.9",   # form data parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",             # for TestClient
    "ruff>=0.4.0",               # linting + formatting
]
prod = [
    "asyncpg>=0.29.0",           # async Postgres driver
    "pgvector>=0.3.0",           # vector search extension
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
